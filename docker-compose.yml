services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enricher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enricher}
      POSTGRES_DB: ${POSTGRES_DB:-enricher}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enricher} -d ${POSTGRES_DB:-enricher}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-enricher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enricher}
      POSTGRES_DB: ${POSTGRES_DB:-enricher}
      API_BASE_URL: https://dummyjson.com
      API_TIMEOUT: ${API_TIMEOUT:-10.0}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  web:
    build: .
    depends_on:
      app:
        condition: service_completed_successfully
    command: ["uvicorn", "app.web.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-enricher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enricher}
      POSTGRES_DB: ${POSTGRES_DB:-enricher}
      API_BASE_URL: https://dummyjson.com
      API_TIMEOUT: ${API_TIMEOUT:-10.0}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

volumes:
  pg_data:
