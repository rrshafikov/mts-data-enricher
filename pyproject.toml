[tool.poetry]
name = "mts-data-enricher"
version = "0.1.0"
description = "Сервис обогащения записей из PostgreSQL данными из публичного REST API"
authors = ["Ramazan Shafikov <rs31113@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.14"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }
httpx = "^0.27.0"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
jinja2 = "^3.1.4"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.3.0"
pytest-mock = "^3.14.0"
respx = "^0.21.1"
testcontainers = { version = "^4.8.0", extras = ["postgres"] }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # ambiguous unicode chars (кириллица в строках)
    "RUF002",  # ambiguous unicode chars в docstring
    "RUF003",  # ambiguous unicode chars в comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
